bundle:
  name: dbx-standard-app

variables:
  app_name:
    default: dev-sridderhoff-dbx-std-app
    description: Workspace-global app name (max 30 chars, lowercase/digits/hyphens only)

resources:
  apps:
    dbx-standard-app:
      name: ${var.app_name}
      description: A standard Databricks app
      source_code_path: .

targets:
  dev:
    mode: development
    default: true
  prod:
    variables:
      app_name: prod-sridderhoff-dbx-std-app