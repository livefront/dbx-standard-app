bundle:
  name: dbx-standard-app

include:
  - resources/*.yml

variables:
  app_name:
    description: Workspace-global app name (max 30 chars, lowercase/digits/hyphens only)
    default: dev-sridderhoff-dbx-std-app
  automation_sp:
    description: Application ID of the automation service principal (dev only)
    default: "1941c580-cf6c-42ae-9c58-31597c07c200"
  catalog_name:
    default: "sridderhoff_dbx_std_app"

resources:
  apps:
    dbx-standard-app:
      name: ${var.app_name}
      description: A standard Databricks app
      source_code_path: .
      config:
        command: ["npm", "run", "start"]
        env:
          - name: LAKEBASE_ENDPOINT
            value_from: postgres
          - name: SYNCED_SCHEMA
            value: ${resources.schemas.synced.name}
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${resources.sql_warehouses.app_warehouse.id}
            permission: CAN_USE
        - name: postgres
          postgres:
            branch: projects/${var.lakebase_project_id}/branches/${var.lakebase_branch_id}
            database: projects/${var.lakebase_project_id}/branches/${var.lakebase_branch_id}/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
  schemas:
    raw:
      catalog_name: ${var.catalog_name}
      name: raw
      comment: Raw landing files
    bronze:
      catalog_name: ${var.catalog_name}
      name: bronze
      comment: Bronze curated tables
    silver:
      catalog_name: ${var.catalog_name}
      name: silver
      comment: Silver curated tables
    gold:
      catalog_name: ${var.catalog_name}
      name: gold
      comment: Gold curated tables
  pipelines:
    support_pipeline:
      name: support-data-pipeline
      catalog: ${var.catalog_name}
      schema: ${resources.schemas.bronze.name}
      serverless: true
      continuous: false
      configuration:
        catalog_name: ${var.catalog_name}
        raw_schema: ${resources.schemas.raw.name}
        silver_schema: ${resources.schemas.silver.name}
        gold_schema: ${resources.schemas.gold.name}
      libraries:
        - glob:
            include: ./pipelines/support/**
  volumes:
    customers:
      name: customers
      catalog_name: ${var.catalog_name}
      schema_name: ${resources.schemas.raw.name}
    tickets:
      name: tickets
      catalog_name: ${var.catalog_name}
      schema_name: ${resources.schemas.raw.name}
    events:
      name: events
      catalog_name: ${var.catalog_name}
      schema_name: ${resources.schemas.raw.name}
  sql_warehouses:
    app_warehouse:
      name: dbx-standard-app-warehouse
      cluster_size: 2X-Small
      warehouse_type: PRO
      auto_stop_mins: 5
      min_num_clusters: 1
      max_num_clusters: 1
      enable_serverless_compute: true
      permissions:
        - level: CAN_USE
          service_principal_name: ${resources.apps.dbx-standard-app.service_principal_client_id}

targets:
  dev:
    mode: development
    default: true
    variables:
      automation_sp: "1941c580-cf6c-42ae-9c58-31597c07c200"
      catalog_name: dev_sridderhoff_dbx_std_app
      lakebase_branch_id: dev
    permissions:
      - group_name: developers
        level: CAN_MANAGE
      - service_principal_name: ${var.automation_sp}
        level: CAN_MANAGE
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
    resources:
      # The shared Lakebase project is owned by this target's state (see
      # resources/lakebase.yml). prevent_destroy keeps `bundle destroy -t dev`
      # from deleting the production branch along with it.
      postgres_projects:
        app_db:
          project_id: ${var.lakebase_project_id}
          display_name: dbx-standard-app
          pg_version: 17
          default_endpoint_settings:
            autoscaling_limit_min_cu: 0.5
            autoscaling_limit_max_cu: 2
          lifecycle:
            prevent_destroy: true
      postgres_branches:
        # Created automatically with the project; adopted here so it can be protected
        # (no delete/reset) and so both branches are declared in one place.
        production:
          branch_id: production
          parent: ${resources.postgres_projects.app_db.name}
          is_protected: true
          no_expiry: true
          replace_existing: true
        dev:
          branch_id: ${var.lakebase_branch_id}
          parent: ${resources.postgres_projects.app_db.name}
          source_branch: ${resources.postgres_projects.app_db.name}/branches/production
          no_expiry: true
      postgres_endpoints:
        # Each branch auto-creates its read-write `primary` compute; adopt them here
        # so their size is managed by the bundle.
        production_primary:
          endpoint_id: primary
          replace_existing: true
          parent: ${resources.postgres_branches.production.name}
          endpoint_type: ENDPOINT_TYPE_READ_WRITE
          autoscaling_limit_min_cu: 0.5
          autoscaling_limit_max_cu: 2
        dev_primary:
          endpoint_id: primary
          replace_existing: true
          parent: ${resources.postgres_branches.dev.name}
          endpoint_type: ENDPOINT_TYPE_READ_WRITE
          autoscaling_limit_min_cu: 0.5
          autoscaling_limit_max_cu: 2
      jobs:
        stop_dev_app:
          name: stop-${var.app_name}-nightly
          tags:
            aidevkit_project: ai-dev-kit
          performance_target: STANDARD
          run_as:
            service_principal_name: ${var.automation_sp}
          schedule:
            quartz_cron_expression: "0 0 19 * * ?"
            timezone_id: "America/New_York"
            pause_status: UNPAUSED
          parameters:
            - name: app_name
              default: ${var.app_name}
          environments:
            - environment_key: default
              spec:
                environment_version: "6"
                dependencies:
                  - databricks-sdk
                  - pandas
          tasks:
            - task_key: stop_app
              environment_key: default
              spark_python_task:
                python_file: ./jobs/stop_app.py
                parameters:
                  - "--app-name"
                  - "{{job.parameters.app_name}}"
        generate_data:
          name: generate-raw-data
          environments:
            - environment_key: default
              spec:
                environment_version: "6"
                dependencies:
                  - pandas
                  - pyarrow
          tasks:
            - task_key: generate
              environment_key: default
              spark_python_task:
                python_file: ./jobs/generate_data.py
                parameters:
                  - "--catalog"
                  - "${var.catalog_name}"
                  - "--schema"
                  - "${resources.schemas.raw.name}"

  prod:
    variables:
      app_name: prod-sridderhoff-dbx-std-app